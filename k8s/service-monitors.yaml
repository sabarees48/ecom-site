# Requires the kube-prometheus-stack CRDs (ServiceMonitor) to already be
# installed — apply this after the install-prometheus-grafana job succeeds.
# Each Service already listens on port 80 (see services/*/k8s/service.yaml),
# so ServiceMonitor targets that same port and just points at path /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service
  namespace: eks-demo
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: user-service
  namespaceSelector:
    matchNames: [eks-demo]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
