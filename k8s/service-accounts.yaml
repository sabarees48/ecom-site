# IRSA ServiceAccounts. Replace ACCOUNT_ID before applying, or template it in
# CI (the deploy-services.yml workflow does this with `sed` — see workflow).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: eks-demo
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/eks-demo-order-service-irsa-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service-sa
  namespace: eks-demo
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/eks-demo-product-service-irsa-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service-sa
  namespace: eks-demo
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/eks-demo-notification-service-irsa-role
