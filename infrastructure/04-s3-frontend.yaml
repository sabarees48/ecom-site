AWSTemplateFormatVersion: '2010-09-09'
Description: S3 bucket configured for static website hosting of the demo frontend.

Parameters:
  BucketName:
    Type: String
    Description: Globally-unique S3 bucket name for the frontend (e.g. eks-demo-frontend-123456789012)

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET]
            AllowedOrigins: ['*']
            MaxAge: 3000

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${FrontendBucket}/*

Outputs:
  BucketName:
    Value: !Ref FrontendBucket
  WebsiteURL:
    Value: !GetAtt FrontendBucket.WebsiteURL
  BucketArn:
    Value: !GetAtt FrontendBucket.Arn
