AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Actions OIDC provider + IAM role so workflows can deploy to AWS
  without storing long-lived access keys.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub org or username, e.g. my-org
  GitHubRepo:
    Type: String
    Description: Repository name, e.g. eks-demo
  ExistingOIDCProviderArn:
    Type: String
    Default: ''
    Description: >
      Leave blank to create a new OIDC provider. If your AWS account already
      has token.actions.githubusercontent.com registered, paste its ARN here instead.

Conditions:
  CreateOIDCProvider: !Equals [!Ref ExistingOIDCProviderArn, '']

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-demo-github-actions-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Ref ExistingOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:*
      Policies:
        - PolicyName: eks-demo-deploy-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationAccess
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource: '*'
              - Sid: ECRAccess
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                Resource: '*'
              - Sid: EKSAccess
                Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - eks:AccessKubernetesApi
                Resource: '*'
              - Sid: S3FrontendAccess
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - '*'
              - Sid: CloudFrontInvalidation
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:ListDistributions
                Resource: '*'
              - Sid: VpcNetworkingAccess
                Effect: Allow
                Action:
                  - ec2:*
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:PassRole
                  - iam:TagRole
                  - iam:CreateOpenIDConnectProvider
                  - iam:GetOpenIDConnectProvider
                Resource: '*'

Outputs:
  RoleArn:
    Value: !GetAtt GitHubActionsDeployRole.Arn
    Description: Add this ARN as the AWS_ROLE_ARN secret/variable in your GitHub repo
