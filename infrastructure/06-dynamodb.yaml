AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DynamoDB tables: Products (used by product-service) and OrderEvents
  (written by the ProcessOrder Lambda when EventBridge fires an OrderPlaced event).

Parameters:
  EnvironmentName:
    Type: String
    Default: eks-demo

Resources:
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  OrderEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-order-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

Outputs:
  ProductsTableName:
    Value: !Ref ProductsTable
    Export:
      Name: !Sub ${EnvironmentName}-ProductsTableName
  ProductsTableArn:
    Value: !GetAtt ProductsTable.Arn
    Export:
      Name: !Sub ${EnvironmentName}-ProductsTableArn
  OrderEventsTableName:
    Value: !Ref OrderEventsTable
    Export:
      Name: !Sub ${EnvironmentName}-OrderEventsTableName
  OrderEventsTableArn:
    Value: !GetAtt OrderEventsTable.Arn
    Export:
      Name: !Sub ${EnvironmentName}-OrderEventsTableArn
