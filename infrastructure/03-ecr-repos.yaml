AWSTemplateFormatVersion: '2010-09-09'
Description: ECR repositories for the 5 EKS demo microservices.

Parameters:
  RepoPrefix:
    Type: String
    Default: eks-demo

Resources:
  UserServiceRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${RepoPrefix}-user-service
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  ProductServiceRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${RepoPrefix}-product-service
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  OrderServiceRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${RepoPrefix}-order-service
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  PaymentServiceRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${RepoPrefix}-payment-service
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  NotificationServiceRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${RepoPrefix}-notification-service
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  AuthServiceRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${RepoPrefix}-auth-service
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

Outputs:
  UserServiceRepoUri:
    Value: !GetAtt UserServiceRepo.RepositoryUri
  ProductServiceRepoUri:
    Value: !GetAtt ProductServiceRepo.RepositoryUri
  OrderServiceRepoUri:
    Value: !GetAtt OrderServiceRepo.RepositoryUri
  PaymentServiceRepoUri:
    Value: !GetAtt PaymentServiceRepo.RepositoryUri
  NotificationServiceRepoUri:
    Value: !GetAtt NotificationServiceRepo.RepositoryUri
  AuthServiceRepoUri:
    Value: !GetAtt AuthServiceRepo.RepositoryUri
