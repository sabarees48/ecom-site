AWSTemplateFormatVersion: '2010-09-09'
Description: >
  API Gateway HTTP API fronting the Analytics Lambda — the "serverless API"
  path in the demo, alongside the 5 container APIs running on EKS.

Parameters:
  EnvironmentName:
    Type: String
    Default: eks-demo

Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${EnvironmentName}-analytics-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, OPTIONS]
        AllowHeaders: ['*']

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::ImportValue: !Sub ${EnvironmentName}-AnalyticsFunctionArn
      PayloadFormatVersion: '2.0'

  SummaryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /summary
      Target: !Sub integrations/${LambdaIntegration}

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::ImportValue: !Sub ${EnvironmentName}-AnalyticsFunctionName
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/summary

Outputs:
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
    Description: Base URL — GET {ApiEndpoint}/summary for the analytics JSON
    Export:
      Name: !Sub ${EnvironmentName}-AnalyticsApiEndpoint
