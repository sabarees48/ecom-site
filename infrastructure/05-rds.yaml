AWSTemplateFormatVersion: '2010-09-09'
Description: >
  RDS PostgreSQL instance backing order-service. Master credentials are
  generated and stored in Secrets Manager automatically — no plaintext
  passwords in the template or parameters.

Parameters:
  EnvironmentName:
    Type: String
    Default: eks-demo
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
  DBAllocatedStorage:
    Type: Number
    Default: 20

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for eks-demo RDS instance
      SubnetIds:
        - Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnet1
        - Fn::ImportValue: !Sub ${EnvironmentName}-PrivateSubnet2

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Postgres access from the VPC (EKS nodes, bastion)
      VpcId:
        Fn::ImportValue: !Sub ${EnvironmentName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.20.0.0/16
          Description: >-
            Demo simplicity: allows the whole VPC CIDR. In production, scope
            this to the EKS node security group and bastion security group only.
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-rds-sg

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub ${EnvironmentName}-orders-db
      Engine: postgres
      EngineVersion: '16.4'
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      DBName: ordersdb
      MasterUsername: ordersadmin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: false

Outputs:
  DBEndpoint:
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: !Sub ${EnvironmentName}-DBEndpoint
  DBPort:
    Value: !GetAtt DBInstance.Endpoint.Port
    Export:
      Name: !Sub ${EnvironmentName}-DBPort
  DBSecretArn:
    Value: !GetAtt DBInstance.MasterUserSecret.SecretArn
    Description: Secrets Manager ARN holding the generated master username/password
    Export:
      Name: !Sub ${EnvironmentName}-DBSecretArn
  DBSecurityGroupId:
    Value: !Ref DBSecurityGroup
    Export:
      Name: !Sub ${EnvironmentName}-DBSecurityGroupId
