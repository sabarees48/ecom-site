# Requires k8s/service-accounts.yaml (product-service-sa, IRSA-annotated) to
# be applied first, and infrastructure/06-dynamodb.yaml + 11-irsa-roles.yaml deployed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: eks-demo
  labels:
    app: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      serviceAccountName: product-service-sa
      containers:
        - name: product-service
          image: ACCOUNT_ID.dkr.ecr.REGION_PLACEHOLDER.amazonaws.com/eks-demo-product-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: PRODUCTS_TABLE
              value: eks-demo-products
            - name: AWS_REGION
              value: REGION_PLACEHOLDER
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 20
