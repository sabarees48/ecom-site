# Requires k8s/service-accounts.yaml (order-service-sa, IRSA-annotated) to be
# applied first, and infrastructure/05-rds.yaml + 07-sns-eventbridge.yaml +
# 11-irsa-roles.yaml deployed. DB_HOST and DB_SECRET_ARN below are filled in
# by the deploy-services.yml workflow from CloudFormation stack outputs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: eks-demo
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: order-service-sa
      containers:
        - name: order-service
          image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/eks-demo-order-service:latest
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: DB_HOST
              value: DB_HOST_PLACEHOLDER
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: ordersdb
            - name: DB_SECRET_ARN
              value: DB_SECRET_ARN_PLACEHOLDER
            - name: EVENT_BUS_NAME
              value: eks-demo-bus
            - name: AWS_REGION
              value: REGION_PLACEHOLDER
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 10
            periodSeconds: 20
